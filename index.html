<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLRG Weibersbrunn - Lakefleisch Reservierung 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dlrg: {
                            yellow: '#FFED00',
                            red: '#E30613',
                            darkred: '#B0000B',
                            dark: '#1A1A1A'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-dlrg-yellow shadow-md border-b-4 border-dlrg-red sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Wieder das PNG-Logo aus dem gleichen Ordner -->
                <img src="dlrg-logo.png" 
                     alt="DLRG Logo" 
                     class="h-12 w-auto object-contain" />
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl text-black leading-tight">DLRG Weibersbrunn</h1>
                    <p class="text-xs font-semibold text-slate-800">Lakefleisch-Fest • 28.12.2026</p>
                </div>
            </div>
            
            <button id="toggleAdminBtn" onclick="handleHeaderBtnClick()" class="flex items-center space-x-1 bg-dlrg-red hover:bg-dlrg-darkred text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
                <span id="adminBtnText">🔒 Helfer-Area</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto w-full p-4 flex-grow">

        <!-- GÄSTE VIEW -->
        <div id="guestView" class="space-y-6">

            <!-- Welcome Banner -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex items-start space-x-4">
                    <div class="p-3 bg-red-100 text-dlrg-red rounded-xl hidden sm:block text-2xl">
                        🔥
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 mb-1">Lakefleisch-Vorbestellung</h2>
                        <p class="text-slate-600 text-sm">
                            Sichern Sie sich Ihre Portionen für unser traditionelles Fest am <strong>28. Dezember 2026</strong>. 
                            Wählen Sie einfach Ihre Wunsch-Uhrzeit aus. Bezahlt wird direkt bei der Abholung vor Ort!
                        </p>
                    </div>
                </div>
            </div>

            <!-- Bestätigungsmeldung (Ohne Abholcode) -->
            <div id="confirmationCard" class="hidden bg-green-50 border-2 border-green-500 rounded-2xl p-6 shadow-md text-center space-y-3">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full mb-
